name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-format:
    name: backend / format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: check
        run: |
          if [ -f pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip — backend not initialized
        if: steps.check.outputs.exists != 'true'
        run: echo "Backend pyproject.toml not found; skipping format check."
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.14"
      - name: Install Ruff
        if: steps.check.outputs.exists == 'true'
        run: pip install ruff
      - name: Ruff format check
        if: steps.check.outputs.exists == 'true'
        run: ruff format --check .

  backend-lint:
    name: backend / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: check
        run: |
          if [ -f pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip — backend not initialized
        if: steps.check.outputs.exists != 'true'
        run: echo "Backend pyproject.toml not found; skipping lint."
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.14"
      - name: Install Ruff
        if: steps.check.outputs.exists == 'true'
        run: pip install ruff
      - name: Ruff lint
        if: steps.check.outputs.exists == 'true'
        run: ruff check .

  backend-typecheck:
    name: backend / typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: check
        run: |
          if [ -f pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip — backend not initialized
        if: steps.check.outputs.exists != 'true'
        run: echo "Backend pyproject.toml not found; skipping type check."
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.14"
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: pip install -e ".[dev]"
      - name: mypy
        if: steps.check.outputs.exists == 'true'
        run: mypy planforge

  backend-test:
    name: backend / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Check backend exists
        id: check
        run: |
          if [ -f pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip — backend not initialized
        if: steps.check.outputs.exists != 'true'
        run: echo "Backend pyproject.toml not found; skipping tests."
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'true'
        with:
          python-version: "3.14"
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: pip install -e ".[dev]"
      - name: pytest
        if: steps.check.outputs.exists == 'true'
        run: pytest

  frontend-format:
    name: frontend / format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip — frontend not initialized
        if: steps.check.outputs.exists != 'true'
        run: echo "Frontend package.json not found; skipping format check."
      - uses: actions/setup-node@v7
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci
      - name: Prettier check
        if: steps.check.outputs.exists == 'true'
        run: npm run format:check

  frontend-lint:
    name: frontend / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip — frontend not initialized
        if: steps.check.outputs.exists != 'true'
        run: echo "Frontend package.json not found; skipping ESLint."
      - uses: actions/setup-node@v7
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci
      - name: ESLint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint

  frontend-typecheck:
    name: frontend / typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip — frontend not initialized
        if: steps.check.outputs.exists != 'true'
        run: echo "Frontend package.json not found; skipping TypeScript check."
      - uses: actions/setup-node@v7
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci
      - name: TypeScript
        if: steps.check.outputs.exists == 'true'
        run: npm run typecheck

  frontend-test:
    name: frontend / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip — frontend not initialized
        if: steps.check.outputs.exists != 'true'
        run: echo "Frontend package.json not found; skipping component tests."
      - uses: actions/setup-node@v7
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci
      - name: Vitest with coverage
        if: steps.check.outputs.exists == 'true'
        run: npm run test:coverage

  frontend-build:
    name: frontend / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip — frontend not initialized
        if: steps.check.outputs.exists != 'true'
        run: echo "Frontend package.json not found; skipping production build."
      - uses: actions/setup-node@v7
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm ci
      - name: Production build
        if: steps.check.outputs.exists == 'true'
        run: npm run build

  backend-audit:
    name: backend / audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit

  frontend-audit:
    name: frontend / audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high

  frontend-openapi:
    name: frontend / openapi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e .
      - name: Export OpenAPI schema
        working-directory: backend
        run: python scripts/export_openapi.py
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Generate API types
        working-directory: frontend
        run: npm run generate:api-types
      - name: Check for OpenAPI drift
        run: git diff --exit-code frontend/openapi/openapi.json frontend/src/api/schema.d.ts
